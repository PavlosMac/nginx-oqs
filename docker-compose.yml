services:
  # Node.js Express API Server
  api-server:
    build: .
    container_name: nodejs-api-server
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    networks:
      - nginx-nodejs-network
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Internal port 3000 (not exposed externally)
    expose:
      - "3000"

  # Nginx Reverse Proxy
  reverse-proxy:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    ports:
      - "8080:80"  # External port 8080 -> Internal port 80
      - "8443:443" # External port 8443 -> Internal port 443 (for future HTTPS)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-server
    restart: unless-stopped
    networks:
      - nginx-nodejs-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  nginx-nodejs-network:
    name: nginx-nodejs-stack
    driver: bridge

volumes:
  nginx_logs:
    name: nginx-logs-volume
